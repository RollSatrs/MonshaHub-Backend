name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # PostgreSQL для миграций и e2e. Значения ниже — только для CI, это не секреты.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monshahub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monshahub_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monshahub_test
      FRONT_URL: http://localhost:3000
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ci
      SMTP_PASS: ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: OpenAPI contract is up to date
        run: pnpm openapi:check

      # Всю цепочку миграций с нуля применяем на пустой БД — заодно проверяем, что она применима.
      - name: Apply migrations (clean database)
        run: pnpm db:migrate

      - name: E2E tests
        run: pnpm test:e2e
